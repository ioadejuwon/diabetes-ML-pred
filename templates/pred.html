<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Softnio">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="images/favicon.png">
    <title>Diabetes Prediction Form</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="nk-body" data-navbar-collapse="xl">
    
    <div class="nk-app-root home-bs-consulting">
        <main class="nk-pages">
            
            <section class="nk-section">
                <div class="nk-mask blur-1 right center">
                </div>
                <div class="container">
                    <div class="row justify-content-center">
                        <div class="col-lg-8 col-xxl-6">
                            <div class="nk-section-head text-center">
                                <span class="nk-section-subtitle">Contact support</span>
                                <h2 class="nk-section-title">Diabetes Prediction Form</h2>
                                <p class="nk-section-text">Please, fill the form below.</p>
                            </div>
                        </div>
                    </div>
                    <div class="row g-gs">
                        <div class="col-lg-12" data-aos="fade-up" data-aos-delay="0">
                            <div class="card rounded-2">
                                <div class="card-body">
                                    <form action="{{ url_for('predict') }}" method="post">
                                        <div class="row g-gs">
                                            <div class="col-lg-6 pt-4">
                                                <div class="form-group">
                                                    <label class="form-label">Gender</label>
                                                    <select class="form-select" id="gender" name="gender" >
                                                        <option value="" selected disabled>Select Gender</option>
                                                        <option value="1">Male</option>
                                                        <option value="0">Female</option>
                                                    </select>
                                                </div>
                                            </div>
                                            <div class="col-lg-6 pt-4">
                                                <div class="form-group">
                                                    <label class="form-label">Age</label>
                                                    <div class="form-control-wrap">
                                                        <input class="form-control" type="number" placeholder="Please, enter your age." id="age" name="age" required>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="col-lg-6 pt-4">
                                                <div class="form-group">
                                                    <label class="form-label">History of Hypertension</label>
                                                    <select class="form-select" id="hypertension" name="hypertension">
                                                        <option value="" selected disabled>Select One</option>
                                                        <option value="1">Yes</option>
                                                        <option value="0">No</option>
                                                    </select>
                                                </div>
                                            </div>
                                            
                                            <div class="col-lg-6 pt-4">
                                                <div class="form-group">
                                                    <label class="form-label">History of Heart Disease</label>
                                                    <select class="form-select" id="heart_disease" name="heart_disease">
                                                        <option value="" selected disabled>Select One</option>
                                                        <option value="1">Yes</option>
                                                        <option value="0">No</option>
                                                    </select>
                                                </div>
                                            </div>
                                            <div class="col-lg-6 pt-4">
                                                <div class="form-group">
                                                    <label class="form-label">History of Smoking</label>
                                                    <select class="form-select" id="smoking_history" name="smoking_history">
                                                        <option value="" selected disabled>Select One</option>
                                                        <option value="0">Never</option>
                                                        <option value="1">Currently Smoking</option>
                                                        <option value="1">Ever</option>
                                                        <option value="1">Not Currently Smoking</option>
                                                        <option value="1">Former</option>
                                                        <option value="-1">No Info</option>
                                                    </select>
                                                </div>
                                            </div>

                                            <div class="col-lg-6 pt-4">
                                                <div class="form-group">
                                                    <label class="form-label">Body Mass Index (BMI)</label>
                                                    <input class="form-control"  type="number" id="bmi" name="bmi" step="0.01" placeholder="Please, enter your BMI.">
                                                </div>
                                            </div>

                                            <div class="col-lg-6 pt-4">
                                                <div class="form-group">
                                                    <label class="form-label">Hemoglobin A1c Level</label>
                                                    <input type="number" id="HbA1c_level" name="HbA1c_level" step="0.01" class="form-control" placeholder="Enter your Hemoglobin A1c Level">
                                                </div>
                                            </div>
                                            

                                            <div class="col-lg-6 pt-4">
                                                <div class="form-group">
                                                    <label class="form-label">Blood Glucose Level</label>
                                                    <input type="number" id="blood_glucose_level" name="blood_glucose_level" step="0.01" class="form-control" placeholder="Blood Glucose Level">
                                                </div>
                                            </div>
                                            
                                           
                                            <div class="col-12 pt-3">
                                                <div class="form-group">
                                                    <a href="{{ url_for('index') }}" class="btn btn-primary" type="submit" id="submit-btn">Go Back</a>
                                                    <input class="btn btn-primary" type="submit" value="Predict Status" style="background-color: rgb(15, 86, 86) !important;">

                                                </div>
                                            </div>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
            <section class="nk-section d-none">
                <div class="container">
                    <div class="nk-cta-wrap nk-cta-card bg-primary-gradient rounded-3 is-theme position-relative overflow-hidden" data-aos="fade-up" data-aos-delay="100">
                        <div class="row g-0 align-items-center overflow-hidden">
                            <div class="col-lg-12 order-lg-0 order-2">
                                <div class="nk-block-head-content  mb-0">
                                    <h2 class="newsletter-heading text-capitalize h1 m-0 mb-4 mb-lg-7">
                                        Start tracking your user analytics to boost your business
                                    </h2>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
            
        </main>
        <footer class="nk-footer is-theme">
            <div class="nk-footer-top">
                <div class="container">
                    <div class="nk-footer-content pt-7">
                        <div class="row text-center text-xl-start justify-content-center justify-content-md-between">
                            <div class="col-md-6 col-lg-3">
                                <div class="nk-footer-brand">
                                    <div class="nk-footer-brand-info">
                                        <div class="nk-footer-logo mb-5 mb-md-0 text-white">
                                            Diabetes Prediction
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-6 col-lg-3">
                                <div class="nk-footer-brand">
                                    <div class="nk-footer-brand-info">
                                        <div class="nk-footer-logo mb-5 mb-md-0 text-white">
                                            &copy; <span id="currentYear"> </span>
                                            All Rights Reserved.
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </footer>
    </div>
    <script type="text/javascript" src="{{ url_for('static', filename='js/bundle.js') }}"></script>
    <script type="text/javascript" src="{{ url_for('static', filename='js/scripts.js') }}"></script>
</body>
</html>
